# RATS default configuration
llm_model: "openai/gpt-5.4"
llm_temperature: 0.2
llm_max_tokens: 8192
llm_reasoning_effort: "low"

max_retries_per_task: 5
execution_timeout_seconds: 900
max_code_length_tokens: 5000
target_iterations: 10

# Environment
env_config_dir: "env_configs/r1pro"
default_scene: null  # auto-discover from catalog

# Skill library
skill_library_path: "skill_library/skills.json"

# Vision/perception servers (host:port)
# Quality checker probes these at startup to block primitives whose servers are offline
servers:
  sam3:
    host: "127.0.0.1"
    port: 8114
    primitives: ["segment_sam3_text_prompt", "segment_sam3_point_prompt", "get_sam3_mask"]
  graspgen:
    host: "127.0.0.1"
    port: 5556
    primitives: ["sample_grasp_pose"]
  molmo:
    host: "127.0.0.1"
    port: 8122
    primitives: ["point_prompt_molmo"]

# Logging
output_dir: "outputs/rats_lifelong"
log_level: "INFO"
