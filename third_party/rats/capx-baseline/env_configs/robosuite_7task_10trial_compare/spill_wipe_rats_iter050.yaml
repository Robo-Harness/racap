env:
  _target_: capx.envs.tasks.franka.franka_spill_wipe.FrankaSpillWipeCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_spill_wipe_low_level
    privileged: false
    apis:
    - FrankaControlApiReducedSkillLibrarySpillWipe
    external_skill_library_path: skill_libraries/libero_iter050.json
    external_skill_library_mode: planner
    external_skill_library_max_skills: 0
    external_skill_library_include_code: true
    external_skill_library_include_primitives: false
    external_skill_planner_max_selected: 6
    external_skill_planner_include_code: false
    external_skill_policy_include_code: true
    external_skill_planner_model: openrouter/google/gemini-3.1-pro-preview
    prompt: "You are controlling a Franka Emika robot with API described below.\nGoal: wipe up the 'brown spill'. \nA sponge is already attached to your gripper/end-effector.\nThe table surface height is exactly z = 0.0 m, and wiping should be performed at that height (no extra offset).\nUse the spill extents to inform the min/max x and y bounds of wiping motions.\nAvoid large wiping motions since large deltas between inverse kinematics solutions may not guarantee optimal trajectories.\nA sponge is already attached to the end-effector, and you should use a downward-facing orientation (0,0,1,0 wxyz) for wiping.\nYou may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.\nAfter this code executes, you will receive the current console stdout and stderr (any errors or print statements made in the code). You will then have the chance to write new code to query the environment state and/or complete the task.\nThe functions (APIs)\
      \ below are already imported to the environment. If you want to use numpy, you need to import it explicitly.\n"
    multi_turn_prompt: null
api_servers:
- _target_: capx.serving.launch_sam3_server.main
  device: cuda
  port: 8114
  host: 127.0.0.1
- _target_: capx.serving.launch_pyroki_server.main
  port: 8116
  host: 127.0.0.1
  robot: panda_description
  target_link: panda_hand
record_video: true
use_img_differencing: true
save_multiturn_prompts: true
save_skill_planner_prompts: true
output_dir: ./outputs/capx_robosuite_7task_10trial_rats_iter050/spill_wipe
trials: 5
num_workers: 1
