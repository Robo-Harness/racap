# CaP-Agent0-derived LIBERO object-swap evaluation config with RATS skills.
# Same as franka_libero_cap_agent0_object_swap_5trials_noensemble_multiturn_video.yaml,
# except it uses a planner to select relevant entries from an external RATS
# skills.json library before appending only the selected skills to the
# policy-writer prompt.
#
# Intended for run_libero_batch:
#   CAPX_USE_GEMINI_PROXY=1 python -m capx.envs.scripts.run_libero_batch \
#     --args.base-config-path env_configs/libero/franka_libero_cap_agent0_object_swap_5trials_noensemble_multiturn_video_rats_skills.yaml \
#     --args.suites libero_object_swap \
#     --args.models google/gemini-3.1-pro-preview \
#     --args.total-trials 5 \
#     --args.num-workers 1 \
#     --args.record-video True \
#     --args.use-img-differencing True \
#     --args.output-dir outputs/capx_eval_agent0_object_swap_5trials_noensemble_multiturn_video_gemini31_rats_skill_planner

env:
  _target_: capx.envs.tasks.franka.franka_libero_env.FrankaLiberoCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.libero.FrankaLiberoEnv
      suite_name: libero_object_swap
      task_id: 0
      privileged: false
      max_steps: 8000
      control_freq: 20
    privileged: false
    apis:
      - FrankaLiberoApiReducedSkillLibrary
    external_skill_library_path: ../skill_library/libero_main_30iter.json
    # planner mode: the policy writer sees only skills selected by the planner.
    external_skill_library_mode: planner
    # 0 means no limit; the planner may inspect every skill entry from the JSON file.
    external_skill_library_max_skills: 0
    # Direct-mode fallback setting; planner mode uses the two planner/policy settings below.
    external_skill_library_include_code: true
    external_skill_library_include_primitives: true
    external_skill_planner_max_selected: 6
    external_skill_planner_include_code: false
    external_skill_policy_include_code: true
    external_skill_planner_model: google/gemini-3.1-pro-preview
    prompt: |
      You are controlling a Franka Emika robot with API described below.
      Goal: {libero_environment_goal}
      You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.
      After this code executes, you will be able to get a new observation of the environment and write new code to complete the task if needed.
      The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.

    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' if the task appears to be complete

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1

  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

record_video: true
output_dir: ./outputs/capx_eval_agent0_object_swap_5trials_noensemble_multiturn_video_gemini31_rats_skill_planner
use_img_differencing: true
save_multiturn_prompts: true
save_skill_planner_prompts: true
use_parallel_ensemble: false
use_multimodel: false
evolve_skill_library: true
skill_library_path: ./outputs/capx_eval_agent0_object_swap_5trials_noensemble_multiturn_video_gemini31_rats_skill_planner/skills.json

trials: 5
num_workers: 1
