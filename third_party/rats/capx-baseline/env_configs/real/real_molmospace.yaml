# Sibling of real.yaml that ALSO injects the MolmoSpaces formula-play
# skill library through the v2 (planner-mode) skill-retrieval path used by the
# LIBERO Table-2 reproduction config
# (franka_libero_cap_agent0_object_swap_5trials_noensemble_multiturn_video_rats_skills_iter050.yaml)
# and by the sibling env_configs/real/real_libero.yaml.
#
# v2 planner mode: a planner LLM reads the skill library and selects up
# to 6 relevant skills *per turn*; only those selected skills are
# appended to the policy-writer's prompt. The policy writer still owns
# code generation and runs against the same FrankaRealControlApi as the
# vanilla real.yaml — i.e. the skill code is shown as inspiration, not
# directly executed.
#
# Why this library: the formula-play skills were learned
# in the MolmoSpaces (FrankaMolmoSpacesNonPriv) environment, whose
# perception API is almost a direct match for the real-Franka API
# (point_prompt_molmo + segment_sam3_*_prompt + plan_grasp + solve_ik +
# move_to_joints + open/close_gripper all exist on FrankaRealControlApi —
# see capx-baseline/capx/integrations/franka/control_reduced.py). The
# learned skills should crib cleanly; the few LIBERO/MolmoSpaces-only
# calls (e.g. inspect_at_wrist, mask_to_world_points) will just fail at
# runtime and trigger REGENERATE on the multi-turn loop.
#
# Usage (matches real.yaml):
#   uv sync --active --extra contactgraspnet
#   uv run --no-sync --active capx/envs/launch.py \
#       --config-path env_configs/real/real_molmospace.yaml

env:
  _target_: capx.envs.tasks.franka.franka_cube_restack.FrankaRestackCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_real_low_level
    privileged: false
    apis:
      - FrankaRealControlApi # Not using reduced skill lib for live demo due to codegen time of low level
    task_only_prompt: "pick up the red cube and lift it"

    # ===== v2 planner-mode skill retrieval (MolmoSpaces formula-play) =====
    # Mirrors franka_libero_cap_agent0_..._rats_skills_iter050.yaml and
    # env_configs/real/real_libero.yaml.
    external_skill_library_path: skill_libraries/molmospace_formula_play.json
    external_skill_library_mode: planner
    external_skill_library_max_skills: 0
    external_skill_library_include_code: true
    external_skill_library_include_primitives: true
    external_skill_planner_max_selected: 6
    external_skill_planner_include_code: false
    external_skill_policy_include_code: true
    external_skill_planner_model: google/gemini-3.1-pro-preview

    prompt: |
      You are controlling a Franka Emika robot with API described below.
      Goal: pick up the red cube and lift it.
      You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.
      After this code executes, you will be able to get a new observation of the environment and write new code to complete the task if needed.
      The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.

    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' if the task appears to be complete

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1

  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
use_img_differencing: true
output_dir: ./outputs/franka_real_molmospace
debug: true

# Save the per-turn planner prompts so you can see which 6 skills the
# planner picked. Off by default in real.yaml; on here so the molmospace
# selection is debuggable in the web UI.
save_skill_planner_prompts: true

web_ui: false         # release runs default to headless CLI; set true only if web-ui assets are available
# web_ui_port: 8200    # optional: override the default web UI port

trials: 1
num_workers: 1
